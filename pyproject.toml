[project]
name = "beaddllm"
version = "0.1.0"
description = "Minecraft Bedrock Add-on特化LLM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "numpy",
    "tokenizers",
    "tiktoken",
    "tqdm",
    "jsonschema>=4.26.0",
    "transformers>=5.18.0",
    "peft>=0.21.1",
    "bitsandbytes>=0.50.2",
    "accelerate>=1.15.0",
    "huggingface-hub>=1.33.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
